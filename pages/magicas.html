<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sección Prohibida</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="../css/styles.css" rel="stylesheet">
<link href="../css/adopciones.css" rel="stylesheet">
</head>

<body class="magical-theme">

<nav class="navbar">
    <div class="container">
        <a class="navbar-brand" href="adopciones.html">← Volver</a>
    </div>
</nav>

<header class="catalog-header text-center text-white">
    <h1>🔮 Sección Prohibida</h1>
    <p>Solo para magos...</p>
</header>

<section class="container mt-4">
    <div class="row g-4" id="petsContainer"></div>
</section>

<!-- MODAL -->
<div class="modal fade" id="petModal">
  <div class="modal-dialog modal-lg">
    <div class="modal-content magical-theme">

      <div class="modal-header">
        <h5 id="modalTitle"></h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body text-center">
        <img id="modalImg" class="img-fluid mb-3">

        <p id="modalDesc"></p>

        <ul class="text-start">
          <li><b>Personalidad:</b> <span id="modalPersonality"></span></li>
          <li><b>Salud:</b> <span id="modalHealth"></span></li>
          <li><b>Habilidad mágica:</b> <span id="modalSpecial"></span></li>
        </ul>

        <button class="btn btn-adopt w-100 mt-3">
          Adoptar criatura 🧙‍♂️
        </button>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
