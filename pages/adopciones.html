<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adopciones - PetGet</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Nunito:wght@400;600;700;800&display=swap"
        rel="stylesheet">
    <!-- <link rel="stylesheet" href="../css/styles.css"> -->
    <link rel="stylesheet" href="../css/adopciones.css">


</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <img src="../img/logos.png" alt="PetGet logo" class="img-nav">PetGet
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto text-center gap-1">
                    <li class="nav-item"><a class="nav-link " href="../index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link active" href="#">Adopciones</a></li>
                    <li class="nav-item"><a class="nav-link" href="favoritos.html">Favoritos</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <header class="catalog-header text-center text-white hero-title ">
        <h1>Adopta tu mejor amigo 🐾</h1>
        <p>Explora mascotas listas para un hogar</p>
    </header>

    <section class="container py-4">

        <input type="text" id="searchInput" class="form-control mb-3" placeholder="Buscar mascota...">

        <div class="text-center mb-4">
            <button class="btn btn-filter active" data-filter="todos">Todos</button>
            <button class="btn btn-filter" data-filter="terrestre">🐾</button>
            <button class="btn btn-filter" data-filter="aereo">🕊</button>
            <button class="btn btn-filter" data-filter="acuatico">🐠</button>
        </div>

        <div class="row g-4" id="petsContainer"></div>

    </section>

    <!-- MODAL -->
    <div class="modal fade" id="petModal">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">

                <div class="modal-header">
                    <h5 id="modalTitle"></h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body" id="modalContent">

                    <!-- VISTA INFO -->
                    <div id="viewInfo">

                        <img id="modalImg" class="img-fluid mb-3">

                        <p id="modalDesc"></p>

                        <ul>
                            <li><b>Personalidad:</b> <span id="modalPersonality"></span></li>
                            <li><b>Salud:</b> <span id="modalHealth"></span></li>
                            <li><b>Condición especial:</b> <span id="modalSpecial"></span></li>
                        </ul>

                        <button class="btn btn-adopt w-100 mt-3" onclick="showForm()">
                            Solicitar cita
                        </button>

                    </div>

                    <!-- VISTA FORMULARIO -->
                    <div id="viewForm" style="display:none;">

                        <h5 class="mb-3">Formulario de contacto</h5>

                        <form id="adoptionForm">

                            <input type="text" id="petName" class="form-control mb-2" readonly>

                            <input type="text" class="form-control mb-2" placeholder="Nombre completo" required>

                            <input type="email" class="form-control mb-2" placeholder="Email" required>

                            <input type="tel" class="form-control mb-2" placeholder="Teléfono" required>

                            <select class="form-control mb-2" required>
                                <option value="">Tipo de vivienda</option>
                                <option>Casa</option>
                                <option>Apartamento</option>
                            </select>

                            <select class="form-control mb-2" required>
                                <option value="">¿Tienes otras mascotas?</option>
                                <option>Sí</option>
                                <option>No</option>
                            </select>

                            <select class="form-control mb-2" required>
                                <option value="">¿Hay niños en casa?</option>
                                <option>Sí</option>
                                <option>No</option>
                            </select>

                            <select class="form-control mb-2" required>
                                <option value="">Disponibilidad</option>
                                <option>Mañana</option>
                                <option>Tarde</option>
                                <option>Noche</option>
                            </select>

                            <textarea class="form-control mb-3" placeholder="Mensaje opcional"></textarea>

                            <button type="submit" class="btn btn-adopt w-100">
                                Enviar solicitud
                            </button>

                        </form>

                    </div>

                    <!-- VISTA CONFIRMACIÓN -->
                    <div id="viewSuccess" style="display:none; text-align:center;">

                        <h4>🎉 ¡Solicitud enviada!</h4>
                        <p>Nos pondremos en contacto contigo en 24-48 horas.</p>

                        <button class="btn btn-adopt mt-3" data-bs-dismiss="modal">
                            Cerrar
                        </button>

                    </div>

                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/adopciones.js"></script>

</body>

</html>
