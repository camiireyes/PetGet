<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦎</title>
    <style>
        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .lizard-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            animation: slideUp 0.8s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        .lizard-frame {
            width: min(70vw, 70vh);
            height: min(70vw, 70vh);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 0 80px rgba(108, 74, 182, 0.6),
                        0 0 200px rgba(108, 74, 182, 0.2);
            animation: glowPulse 2s ease-in-out 0.8s infinite alternate;
        }

        .lizard-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(60px) scale(0.85);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes glowPulse {
            from {
                box-shadow: 0 0 80px rgba(108, 74, 182, 0.6),
                            0 0 200px rgba(108, 74, 182, 0.2);
            }
            to {
                box-shadow: 0 0 120px rgba(108, 74, 182, 0.9),
                            0 0 300px rgba(108, 74, 182, 0.4);
            }
        }
    </style>
</head>
<body>

    <div class="lizard-wrapper">
        <div class="lizard-frame">
            <img src="https://i.giphy.com/LPFNd1AJBoYcVUExmE.webp" alt="🦎">
        </div>
    </div>

    <script>
        const REDIRECT = "adopciones.html";

        function redirect() {
            window.location.href = REDIRECT;
        }

        document.addEventListener("keydown", redirect);
        document.addEventListener("click", redirect);
    </script>

</body>
</html>
